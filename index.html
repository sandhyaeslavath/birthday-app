<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(to right, #ff758c, #ff7eb3);
    overflow: hidden;
    text-align: center;
    color: white;
}

/* Floating Hearts */
.heart {
    position: absolute;
    color: red;
    font-size: 20px;
    animation: float 6s linear infinite;
}

@keyframes float {
    0% { transform: translateY(100vh); opacity: 1; }
    100% { transform: translateY(-10vh); opacity: 0; }
}

/* Message Box */
#messageBox {
    width: 80%;
    margin: 100px auto;
    font-size: 20px;
    line-height: 1.6;
}
</style>
</head>

<body>

<h1>🎂 Happy Birthday 🎂</h1>

<div id="messageBox"></div>

<!-- Background Music -->
<audio autoplay loop>
    <source src="https://www.bensound.com/bensound-music/bensound-love.mp3" type="audio/mp3">
</audio>

<script>

/* Typing Message */
let text = `Happy Birthday. I know things between us have changed, but I just want you to know that I still wish happiness, success, and peace for you always. You were and will always be special to me.

I don’t know what the future holds, but I’m grateful for the memories we shared. Take care and have a beautiful birthday.

Even though we are not together now, my prayers and good wishes for you will never change. You still mean a lot to me, and I genuinely hope this year brings you happiness and everything you dream of.

I don’t know what the future holds for us, but I want you to know I still care about you and I’m still waiting for you. I hope you’re happy and doing well. You will always be special to me.

💌 From Sandy`;

let i = 0;
function typing() {
    if (i < text.length) {
        document.getElementById("messageBox").innerHTML += text.charAt(i);
        i++;
        setTimeout(typing, 40);
    }
}
typing();

/* Floating Hearts Animation */
function createHeart() {
    let heart = document.createElement("div");
    heart.classList.add("heart");
    heart.innerHTML = "❤️";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = Math.random() * 20 + 20 + "px";
    document.body.appendChild(heart);

    setTimeout(() => {
        heart.remove();
    }, 6000);
}

setInterval(createHeart, 300);

</script>

</body>
</html>
